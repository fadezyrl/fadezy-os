# FADEZY OS — Supabase CLI configuration (Phase 01 foundation)
# Link this folder to your remote project with: supabase link --project-ref <ref>
# Docs: https://supabase.com/docs/guides/cli

project_id = "fadezy-os"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Auth policies and providers will be configured in a later phase.
enable_signup = false

[storage]
enabled = true
# Storage buckets will be introduced when file management is implemented.
